# Render blueprint — dev environment only (backend serves from develop).
# Prod backend service and custom domain are a later phase.
services:
  - type: web
    name: covey-keep-api
    runtime: python
    region: ohio
    # preDeployCommand requires a paid instance type; free would need
    # migrations folded into buildCommand instead.
    plan: starter
    branch: develop
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # --forwarded-allow-ips="*" is safe HERE ONLY because Render's load
    # balancer is the sole ingress to the service port — the app is not
    # otherwise reachable, so every peer is the proxy. Never copy the
    # wildcard to a service whose port is directly reachable. Without these
    # flags uvicorn trusts only 127.0.0.1, ignores X-Forwarded-For, and every
    # request records the load balancer's address as the client (breaking the
    # per-IP rate limit and the tos_acceptances.accepted_ip audit trail).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: covey-keep-db-dev
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://covey-keep.netlify.app,https://develop--covey-keep.netlify.app
      - key: APP_BASE_URL
        value: https://develop--covey-keep.netlify.app
      - key: API_BASE_URL
        value: https://covey-keep-api.onrender.com
      # WebAuthn Relying Party (CK-10). A passkey is cryptographically BOUND to
      # its RP ID: every credential enrolled against this *.netlify.app name
      # becomes useless the day the app moves to a custom domain (the name is
      # not cleared yet). That is why the passkey UI stays unpromoted until the
      # domain is final, and why the prod-cutover phase must warn that existing
      # passkeys need re-enrolment when these values change.
      - key: WEBAUTHN_RP_ID
        value: develop--covey-keep.netlify.app
      - key: WEBAUTHN_ORIGIN
        value: https://develop--covey-keep.netlify.app
      # Console mode prints magic links to the service logs. The flip to real
      # delivery (provider mode) is its own later phase, per the family
      # transactional-email standard.
      - key: EMAIL_MODE
        value: console
      # Slot only — Render never populates a sync:false var added after the
      # service exists; the value is hand-set in the dashboard (CK-5 OOB step).
      - key: SESSION_SECRET
        sync: false
      # Cloudflare R2 (CK-33; media pipeline record §11). These declarations
      # CREATE NO VALUES and must not be expected to: all seven were hand-set
      # in the dashboard on 2026-09-07, BEFORE these lines existed — the
      # ordering the SESSION_SECRET note above makes mandatory. The dashboard
      # is the running service's source of truth; the lines exist for the
      # blueprint's completeness and for the prod service, which will be
      # created from this file and will need its own values set the same way.
      # Two bucket names are plain values (they are configuration, and they
      # match the dashboard exactly). The endpoint URL is a slot: it carries
      # the Cloudflare account id, which no file in either repo records, and a
      # placeholder `value:` here would OVERWRITE the live value on the next
      # blueprint sync. The two credentials are scoped differently on
      # purpose — upload: quarantine only, read+write; serve: published only,
      # read only — and scripts/verify_r2_credentials.py proves that split
      # against the live buckets. The worker credential (both buckets) never
      # enters this service: it belongs to the worker service, CK-35.
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_QUARANTINE
        value: coveykeep-dev-quarantine
      - key: R2_BUCKET_PUBLISHED
        value: coveykeep-dev
      - key: R2_UPLOAD_ACCESS_KEY_ID
        sync: false
      - key: R2_UPLOAD_SECRET_ACCESS_KEY
        sync: false
      - key: R2_SERVE_ACCESS_KEY_ID
        sync: false
      - key: R2_SERVE_SECRET_ACCESS_KEY
        sync: false
      # R2_WORKER_* MUST NEVER BE ADDED HERE, in the blueprint or in this
      # service's dashboard. That credential is read-write on BOTH buckets —
      # it can read quarantine AND serve published, the exact combination the
      # two-bucket split exists to prevent — and verify_r2_credentials.py
      # would not catch it landing here, because it tests the credentials it
      # is given, not which service holds them. One dashboard entry in the
      # wrong column silently undoes what CK-33 proved. The web Settings
      # class has no field for it, by construction (config.py).

  # The ingest worker (CK-35; media pipeline record §8) — the second service
  # off the same repo, branch and database. Background workers have no free
  # instance type, hence starter.
  - type: worker
    name: covey-keep-worker
    runtime: python
    region: ohio
    plan: starter
    branch: develop
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # NO preDeployCommand HERE, AND NONE MAY EVER BE ADDED. Only the web
    # service runs `alembic upgrade head` (record §8): a push to develop
    # deploys BOTH services, and two `alembic upgrade` processes racing one
    # database fail on the first deploy after the worker exists. This is the
    # single line most likely to be "helpfully" added later — do not. The
    # worker tolerates starting against a schema the web service has not
    # finished migrating: it fails its first poll and retries; it never
    # crash-loops on it (app/worker.py, pinned by test).
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      # SIX application variables, and exactly six (WorkerSettings in
      # config.py): the database, the endpoint, the two bucket names, and
      # the WORKER credential (Object Read & Write on both buckets, record
      # §11.1). Not SESSION_SECRET, not R2_UPLOAD_*, not R2_SERVE_* — the
      # worker has no field for any of them and boots without them; adding
      # one here would give one process the powers the split keeps apart.
      # The two `sync: false` credential halves and the endpoint URL follow
      # the SESSION_SECRET / R2_ENDPOINT_URL rules above: the blueprint
      # declares the slots and creates no values. For a NEW service Render
      # does not populate them at creation either, so the expected sequence
      # (CK-35 out-of-band step 2) is: blueprint sync creates the service,
      # its first boot fails on the missing values — which breaks nothing,
      # no request depends on a background worker — the values are set in
      # THIS service's dashboard, and it is redeployed.
      - key: DATABASE_URL
        fromDatabase:
          name: covey-keep-db-dev
          property: connectionString
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_QUARANTINE
        value: coveykeep-dev-quarantine
      - key: R2_BUCKET_PUBLISHED
        value: coveykeep-dev
      - key: R2_WORKER_ACCESS_KEY_ID
        sync: false
      - key: R2_WORKER_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: covey-keep-db-dev
    region: ohio
    # Matches the postgres:16 dev container.
    postgresMajorVersion: "16"
    # Free Postgres expires after 30 days; basic-256mb (~$7/mo) does not.
    plan: basic-256mb
