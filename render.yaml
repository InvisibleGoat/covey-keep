# Render blueprint — dev environment only (backend serves from develop).
# Prod backend service and custom domain are a later phase.
services:
  - type: web
    name: covey-keep-api
    runtime: python
    region: ohio
    # preDeployCommand requires a paid instance type; free would need
    # migrations folded into buildCommand instead.
    plan: starter
    branch: develop
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # --forwarded-allow-ips="*" is safe HERE ONLY because Render's load
    # balancer is the sole ingress to the service port — the app is not
    # otherwise reachable, so every peer is the proxy. Never copy the
    # wildcard to a service whose port is directly reachable. Without these
    # flags uvicorn trusts only 127.0.0.1, ignores X-Forwarded-For, and every
    # request records the load balancer's address as the client (breaking the
    # per-IP rate limit and the tos_acceptances.accepted_ip audit trail).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: covey-keep-db-dev
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://covey-keep.netlify.app,https://develop--covey-keep.netlify.app
      - key: APP_BASE_URL
        value: https://develop--covey-keep.netlify.app
      - key: API_BASE_URL
        value: https://covey-keep-api.onrender.com
      # WebAuthn Relying Party (CK-10). A passkey is cryptographically BOUND to
      # its RP ID: every credential enrolled against this *.netlify.app name
      # becomes useless the day the app moves to a custom domain (the name is
      # not cleared yet). That is why the passkey UI stays unpromoted until the
      # domain is final, and why the prod-cutover phase must warn that existing
      # passkeys need re-enrolment when these values change.
      - key: WEBAUTHN_RP_ID
        value: develop--covey-keep.netlify.app
      - key: WEBAUTHN_ORIGIN
        value: https://develop--covey-keep.netlify.app
      # Console mode prints magic links to the service logs. The flip to real
      # delivery (provider mode) is its own later phase, per the family
      # transactional-email standard.
      - key: EMAIL_MODE
        value: console
      # Slot only — Render never populates a sync:false var added after the
      # service exists; the value is hand-set in the dashboard (CK-5 OOB step).
      - key: SESSION_SECRET
        sync: false

databases:
  - name: covey-keep-db-dev
    region: ohio
    # Matches the postgres:16 dev container.
    postgresMajorVersion: "16"
    # Free Postgres expires after 30 days; basic-256mb (~$7/mo) does not.
    plan: basic-256mb
